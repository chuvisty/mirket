name: Deploy Firebase Functions on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy_functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: npm ci
        working-directory: ./functions
      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MIRKET_TEAM }}'
      - name: Create .env file for Functions
        run: |
          echo "META_ACCESS_TOKEN=${{ secrets.META_ACCESS_TOKEN }}" >> functions/.env
          echo "PHONE_NUMBER_ID=${{ secrets.PHONE_NUMBER_ID }}" >> functions/.env
          echo "TEMPLATE_NAME=${{ secrets.TEMPLATE_NAME }}" >> functions/.env
      - name: Deploy to Firebase Functions
        run: npx firebase-tools deploy --only functions --project mirket-team --force --non-interactive --debug
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}


