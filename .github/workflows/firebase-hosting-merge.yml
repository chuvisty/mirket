name: Deploy to Firebase Hosting and Firestore Rules on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MIRKET_TEAM }}
          channelId: live
          projectId: mirket-team

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy Firestore Rules
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MIRKET_TEAM }}' > sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=sa.json
          npx firebase-tools deploy --only firestore:rules --project mirket-team
          rm sa.json
