<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İş Arıyorum</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="headerContainer"></div>


<main class="container">
  <div style="width: 100%; max-width: 600px; display: flex; justify-content: center; gap: 10px; margin-bottom: 20px;">
    <button class="btn primary" style="flex: 1;" onclick="showWorkerFeed()">Aktif İlanlar</button>
    <button class="btn secondary" style="flex: 1;" onclick="showMyApplications()">Başvurularım</button>
  </div>

  <section class="card" id="workerFeedSection">
    <h1 id="workerFeedTitle">Aktif İlanlar</h1>
    <p id="workerFeedDesc">Bölgendeki açık pozisyonları incele ve hemen başvur.</p>

    <div id="workerFeedMessage" class="auth-message hidden" role="alert"></div>

    <div class="filter-section" style="margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
      <input type="text" id="filterCity" placeholder="İl (örn. İstanbul)" style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
      <input type="text" id="filterDistrict" placeholder="İlçe (opsiyonel)" style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
      <button class="btn secondary" style="width: auto; padding: 10px 20px;" onclick="applyFilters()">Filtrele</button>
    </div>

    <div id="jobsFeedList" class="jobs-list hidden">
      <!-- Jobs will be rendered here dynamically -->
      <p>Yükleniyor...</p>
    </div>
  </section>

  <section class="card hidden" id="myApplicationsSection">
    <h1>Başvurularım</h1>
    <p>Daha önce başvuru yaptığınız ilanlar ve güncel durumları.</p>
    
    <div id="myApplicationsList" class="jobs-list">
      <p>Yükleniyor...</p>
    </div>
  </section>
</main>

<div id="footerContainer"></div>

<script src="firebase.js"></script>
<script src="js/core.js"></script>
<script src="js/auth-ui.js"></script>
<script src="js/account.js"></script>
<script src="js/restaurant.js"></script>
<script src="js/worker.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
